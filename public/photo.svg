<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <!-- Background building & sky gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fa9a3"/>
      <stop offset="40%" stop-color="#bcc4be"/>
      <stop offset="100%" stop-color="#d8ded9"/>
    </linearGradient>

    <linearGradient id="buildingUpper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6a674"/>
      <stop offset="50%" stop-color="#c48f58"/>
      <stop offset="100%" stop-color="#b07842"/>
    </linearGradient>

    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8beb9"/>
      <stop offset="50%" stop-color="#a4aca6"/>
      <stop offset="100%" stop-color="#909892"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ea39c"/>
      <stop offset="40%" stop-color="#80857e"/>
      <stop offset="100%" stop-color="#585c56"/>
    </linearGradient>

    <!-- Subject Gradients -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b88e"/>
      <stop offset="60%" stop-color="#d99f72"/>
      <stop offset="100%" stop-color="#c48557"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="25%" stop-color="#181d24"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f7f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="tieGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="pantsGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#2c3a54"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Paisley tie pattern -->
    <pattern id="tiePattern" width="16" height="24" patternUnits="userSpaceOnUse">
      <path d="M 8,4 Q 13,8 10,14 Q 8,18 5,14 Q 3,10 8,4 Z" fill="none" stroke="#e0f2fe" stroke-width="1" opacity="0.6"/>
      <circle cx="8" cy="12" r="1" fill="#bae6fd" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- 1. BACKGROUND ENVIRONMENT (Matching 1000460000.jpg) -->
  <!-- Sky / Upper Air -->
  <rect x="0" y="0" width="720" height="380" fill="url(#skyGrad)"/>

  <!-- Upper House Architecture on Left/Top -->
  <rect x="0" y="0" width="160" height="360" fill="#a88b77"/>
  <rect x="10" y="20" width="70" height="110" fill="#3b332a"/>
  <rect x="14" y="24" width="62" height="102" fill="#8cb3c9" opacity="0.6"/>

  <!-- Center/Right Multi-Story Building with Stone Facade -->
  <polygon points="270,0 720,0 720,380 270,380" fill="#8c7a6b"/>
  <rect x="390" y="0" width="190" height="110" fill="url(#buildingUpper)"/>
  <rect x="405" y="10" width="70" height="85" fill="#383838"/>
  <rect x="410" y="15" width="28" height="75" fill="#bae6fd" opacity="0.5"/>
  <rect x="442" y="15" width="28" height="75" fill="#bae6fd" opacity="0.5"/>

  <!-- Building Cutout / Balcony Recess -->
  <rect x="390" y="115" width="330" height="175" fill="#4a443e"/>
  <rect x="690" y="185" width="30" height="95" fill="#1e1b18"/>

  <!-- Left Gate with Horizontal Bars & Bronze Scrollwork -->
  <rect x="0" y="320" width="180" height="280" fill="#2d2d2d"/>
  <line x1="0" y1="340" x2="180" y2="340" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="370" x2="180" y2="370" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="400" x2="180" y2="400" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="430" x2="180" y2="430" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="460" x2="180" y2="460" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="490" x2="180" y2="490" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="520" x2="180" y2="520" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="0" y1="550" x2="180" y2="550" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Bronze gate ornament fill -->
  <rect x="20" y="380" width="140" height="130" fill="#8c6239" opacity="0.85"/>

  <!-- Concrete Wall Behind Shahzaib with Decorative Arches -->
  <rect x="175" y="210" width="545" height="520" fill="url(#wallGrad)"/>

  <!-- Arch 1 (Left) -->
  <path d="M 220,580 L 220,440 A 80,80 0 0,1 380,440 L 380,580" fill="none" stroke="#e8ece9" stroke-width="20" stroke-linecap="round"/>
  <path d="M 230,580 L 230,445 A 70,70 0 0,1 370,445 L 370,580" fill="none" stroke="#cfd6d1" stroke-width="6"/>
  <circle cx="300" cy="355" r="16" fill="#f1f5f2"/>

  <!-- Arch 2 (Right, Very Prominent in photo) -->
  <path d="M 430,640 L 430,420 A 105,105 0 0,1 640,420 L 640,640" fill="none" stroke="#e8ece9" stroke-width="26" stroke-linecap="round"/>
  <path d="M 445,640 L 445,425 A 90,90 0 0,1 625,425 L 625,640" fill="none" stroke="#cfd6d1" stroke-width="8"/>
  <circle cx="535" cy="310" r="22" fill="#f1f5f2"/>
  <rect x="615" y="565" width="40" height="75" fill="#f1f5f2" stroke="#d5ded8" stroke-width="3"/>

  <!-- Green foliage on right side -->
  <circle cx="680" cy="460" r="28" fill="#4d7c0f" opacity="0.85"/>
  <circle cx="705" cy="485" r="32" fill="#65a30d" opacity="0.9"/>
  <circle cx="670" cy="510" r="24" fill="#3f6212" opacity="0.85"/>

  <!-- Ground & Street Pavement at Bottom -->
  <polygon points="0,670 720,670 720,1280 0,1280" fill="url(#groundGrad)"/>
  <!-- Curb stone border -->
  <polygon points="0,660 720,695 720,740 0,705" fill="#cbd5e1" opacity="0.8"/>
  <polygon points="0,705 720,740 720,765 0,730" fill="#94a3b8" opacity="0.9"/>

  <!-- 2. SHAHZAIB ARSHAD PORTRAIT (Centered Subject) -->
  <g id="shahzaib-figure" filter="url(#shadowFilter)">
    <!-- Navy Blue Formal Trousers (Hands in Pockets) -->
    <path d="M 230,760 
             L 490,760 
             L 510,1280 
             L 375,1280 
             L 360,880 
             L 345,1280 
             L 210,1280 
             Z" fill="url(#pantsGrad)"/>

    <!-- Trousers Creases & Folds -->
    <line x1="280" y1="780" x2="285" y2="1280" stroke="#172033" stroke-width="4"/>
    <line x1="440" y1="780" x2="435" y2="1280" stroke="#172033" stroke-width="4"/>
    <!-- Trouser pocket slits -->
    <path d="M 235,765 Q 260,820 270,840" stroke="#0f172a" stroke-width="5" fill="none"/>
    <path d="M 485,765 Q 460,820 450,840" stroke="#0f172a" stroke-width="5" fill="none"/>

    <!-- Black Leather Belt -->
    <rect x="235" y="750" width="250" height="24" rx="3" fill="#090d14"/>
    <!-- Silver Rectangular Buckle -->
    <rect x="345" y="746" width="30" height="32" rx="2" fill="#cbd5e1"/>
    <rect x="350" y="751" width="20" height="22" rx="1" fill="#090d14"/>
    <rect x="358" y="746" width="4" height="32" fill="#94a3b8"/>

    <!-- White Long-Sleeve Dress Shirt (Torso) -->
    <path d="M 160,560 
             Q 210,430 305,420 
             L 415,420 
             Q 510,430 560,560 
             L 485,758 
             L 235,758 
             Z" fill="url(#shirtGrad)"/>

    <!-- Left Chest Pocket (Shahzaib's left, viewer's right) -->
    <path d="M 405,530 L 465,530 L 465,605 Q 435,620 405,605 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Shirt Buttons Placket -->
    <line x1="360" y1="440" x2="360" y2="755" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="360" cy="510" r="3" fill="#cbd5e1"/>
    <circle cx="360" cy="580" r="3" fill="#cbd5e1"/>
    <circle cx="360" cy="650" r="3" fill="#cbd5e1"/>
    <circle cx="360" cy="720" r="3" fill="#cbd5e1"/>

    <!-- Sleeves (White Dress Shirt) with Hands in Pockets -->
    <!-- Left Arm (Viewer's Left) -->
    <path d="M 160,560 
             Q 185,670 215,750 
             L 255,755 
             Q 230,680 205,570 
             Z" fill="url(#shirtGrad)"/>
    <ellipse cx="238" cy="762" rx="16" ry="12" fill="#d99f72"/> <!-- Hand in pocket -->

    <!-- Right Arm (Viewer's Right) with Watch -->
    <path d="M 560,560 
             Q 535,670 505,750 
             L 465,755 
             Q 490,680 515,570 
             Z" fill="url(#shirtGrad)"/>
    <ellipse cx="482" cy="762" rx="16" ry="12" fill="#d99f72"/> <!-- Hand in pocket -->

    <!-- Steel Watch on Wrist (Shahzaib's Left Wrist) -->
    <rect x="474" y="725" width="28" height="18" rx="3" fill="#0f172a"/>
    <circle cx="488" cy="734" r="6" fill="#38bdf8"/>
    <rect x="472" y="730" width="32" height="8" rx="2" fill="#94a3b8" opacity="0.8"/>

    <!-- Shirt Wrinkles / Realistic Folds -->
    <path d="M 210,580 Q 260,630 250,740" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 510,580 Q 460,630 470,740" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Neck -->
    <rect x="325" y="375" width="70" height="70" fill="url(#skinGrad)"/>
    <!-- Neck shadow under chin -->
    <path d="M 325,410 Q 360,430 395,410 L 395,385 L 325,385 Z" fill="#b87a4a" opacity="0.45"/>

    <!-- White Shirt Collar Points (Prominent & Crisp) -->
    <!-- Left Collar Point -->
    <polygon points="305,420 360,465 330,485 285,435" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Right Collar Point -->
    <polygon points="415,420 360,465 390,485 435,435" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Sky-Blue Paisley Silk Necktie (Exact Match to 1000460000.jpg) -->
    <!-- Tie Knot -->
    <polygon points="345,455 375,455 370,485 350,485" fill="url(#tieGrad)"/>
    <polygon points="345,455 375,455 370,485 350,485" fill="url(#tiePattern)"/>
    <!-- Tie Body hanging straight down -->
    <path d="M 348,485 
             L 372,485 
             L 384,725 
             L 360,750 
             L 336,725 
             Z" fill="url(#tieGrad)"/>
    <path d="M 348,485 
             L 372,485 
             L 384,725 
             L 360,750 
             L 336,725 
             Z" fill="url(#tiePattern)"/>
    <!-- Tie Center crease shadow -->
    <line x1="360" y1="485" x2="360" y2="745" stroke="#0284c7" stroke-width="2" opacity="0.4"/>

    <!-- Head & Face (Shahzaib Arshad) -->
    <ellipse cx="360" cy="340" rx="66" ry="80" fill="url(#skinGrad)"/>

    <!-- Groomed Black Beard & Mustache -->
    <!-- Jawline & Chin Beard -->
    <path d="M 298,340 
             Q 305,405 360,416 
             Q 415,405 422,340 
             Q 405,395 360,402 
             Q 315,395 298,340 
             Z" fill="#14181f"/>
    <!-- Full Chin Beard fill -->
    <ellipse cx="360" cy="402" rx="30" ry="15" fill="#0d1117"/>

    <!-- Neatly Groomed Mustache -->
    <path d="M 330,372 
             Q 360,366 390,372 
             Q 360,382 330,372 
             Z" fill="#11161d"/>

    <!-- Lips -->
    <path d="M 342,378 Q 360,384 378,378" stroke="#aa5b39" stroke-width="3" fill="none"/>

    <!-- Nose -->
    <path d="M 360,315 L 354,352 L 366,352 Z" fill="#c48557" opacity="0.5"/>
    <ellipse cx="351" cy="353" rx="3" ry="2" fill="#8f562b"/>
    <ellipse cx="369" cy="353" rx="3" ry="2" fill="#8f562b"/>

    <!-- Dark Expressive Eyes & Clean Eyebrows -->
    <!-- Eyebrows -->
    <path d="M 314,305 Q 336,296 350,305" stroke="#11161d" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 406,305 Q 384,296 370,305" stroke="#11161d" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="334" cy="318" rx="10" ry="6" fill="#ffffff"/>
    <ellipse cx="386" cy="318" rx="10" ry="6" fill="#ffffff"/>
    <circle cx="334" cy="318" r="5" fill="#1e1815"/>
    <circle cx="386" cy="318" r="5" fill="#1e1815"/>
    <circle cx="336" cy="316" r="1.8" fill="#ffffff"/>
    <circle cx="388" cy="316" r="1.8" fill="#ffffff"/>

    <!-- Ears -->
    <ellipse cx="295" cy="342" rx="8" ry="18" fill="url(#skinGrad)"/>
    <ellipse cx="425" cy="342" rx="8" ry="18" fill="url(#skinGrad)"/>

    <!-- Styled Thick Black Pompadour Hair (Exact Match) -->
    <path d="M 296,335 
             Q 282,230 345,210 
             Q 380,200 422,230 
             Q 438,270 424,335 
             Q 412,280 360,275 
             Q 312,280 296,335 
             Z" fill="url(#hairGrad)"/>

    <!-- High Volume Hair Texture Strands -->
    <path d="M 305,280 Q 340,215 375,218" stroke="#374151" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M 325,275 Q 365,212 405,225" stroke="#4b5563" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 345,272 Q 385,215 415,245" stroke="#374151" stroke-width="3" fill="none" opacity="0.5"/>
  </g>
</svg>